[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "python-cli-project-template"
version = "0.0.1"
authors = [
  { name="Nathaniel Gamo", email="nathaniel.c.gamo@gmail.com" },
]
description = "An example package"
readme = "README.md"
license = "MIT"
license-files = ["LICEN[CS]E*"]
requires-python = ">=3.14"
dependencies = [
    "ast_serialize>=0.13.1",
    "dotenv>=0.9.9",
    "librt>=0.16.0",
    "mypy>=2.4.1",
    "mypy_extensions>=1.2.0",
    "Nuitka>=4.3.5",
    "packaging>=26.3",
    "pathspec>=1.1.1",
    "pip-review>=1.3.0",
    "python-dotenv>=1.2.4",
    "ruff>=0.17.4",
    "typing_extensions>=4.16.0",
]

[project.urls]
Homepage = "https://github.com/nathaniel-gamo/python-cli-project-template"